<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Delivery bike/scooter icon -->
  <g transform="translate(100, 100)">
    <!-- Wheel 1 (left) -->
    <circle cx="-35" cy="20" r="15" fill="none" stroke="#FF8C00" stroke-width="3"/>
    <circle cx="-35" cy="20" r="10" fill="none" stroke="#FF8C00" stroke-width="2"/>
    
    <!-- Wheel 2 (right) -->
    <circle cx="35" cy="20" r="15" fill="none" stroke="#FF8C00" stroke-width="3"/>
    <circle cx="35" cy="20" r="10" fill="none" stroke="#FF8C00" stroke-width="2"/>
    
    <!-- Frame -->
    <line x1="-30" y1="5" x2="30" y2="5" stroke="#FF8C00" stroke-width="3" stroke-linecap="round"/>
    <line x1="-32" y1="0" x2="-35" y2="20" stroke="#FF8C00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="35" y2="20" stroke="#FF8C00" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Seat -->
    <rect x="-10" y="-8" width="20" height="4" rx="2" fill="#FF8C00"/>
    
    <!-- Food delivery box -->
    <rect x="5" y="-20" width="22" height="15" rx="2" fill="#FF8C00" opacity="0.9"/>
    <line x1="16" y1="-20" x2="16" y2="-5" stroke="white" stroke-width="1.5"/>
  </g>
</svg>